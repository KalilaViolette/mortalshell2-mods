; MortalShell2TTS v0.9.263 example configuration
; TTSConfig.ini is generated automatically and is intentionally not shipped,
; so installing an update over an existing mod does not overwrite user settings.
; Azure Speech keys are never stored in this file.

[Meta]
; Schema 3 keeps schema-2 voice/queue settings and adds a complete-snapshot end marker plus last-known-good recovery.
ConfigSchema=3

[Mod]
Narration=true
ReadDelayMs=0
AnnouncePageNumber=false
; Captured Unreal FKey chord or sequence. The clean-install default is Ctrl, T, T, S;
; the sequence may be entered while Ctrl remains held. Escape alone cancels recording;
; modified combinations such as Shift+Escape remain valid.
MenuKeybind=seq:LeftControl>T>T>S
; Treat Left/Right Ctrl, Shift, and Alt as the same modifier while matching saved binds.
; Set false if you want exact left/right modifier behavior.
MatchModifierSides=true
PauseGameWhileMenuOpen=false
; [PERF] summaries every 10 s in UE4SS.log. Off is free.
LogPerformance=false
; Routine DIAG lines (menu input, redraws, helper traffic). Off is quiet; startup, session
; and failure events are always logged. Turn on before reproducing a bug.
DebugLogging=false
; Controller FKeys / analog tokens. Circle/B alone cancels recording; combinations such as L3+Circle/B are valid.
ControllerMenuBind=Gamepad_LeftThumbstick+Gamepad_RightThumbstick
PanelOpacity=94
PanelFontSize=22

[Speech]
; Windows Speech voice. "default" follows the Windows default TTS voice.
Voice=default
; Azure voice ShortName. The in-game Voice row uses Azure's live voice list when Azure is selected.
AzureVoice=en-US-AvaMultilingualNeural
Rate=0
Volume=100
; Pitch is -6 through +6. Azure Dragon HD voices report N/A in the UI because prosody pitch is not supported.
Pitch=0
; Azure speaking style. "default" means the voice's normal style; voices without StyleList show N/A.
VoiceStyle=default
; Pipe-separated favorites maintained by the in-game voice browser.
FavoriteWindowsVoices=
FavoriteAzureVoices=
; interrupt, queue, or ignore. Interrupt preserves pre-v0.9.78 behavior.
SpeechQueue=interrupt
; Off is 0. Other in-game choices are 1, 3, 5, and 10 seconds.
DuplicateTextSeconds=0
; Master pronunciation-normalization switch. Off bypasses shipped and user rules without deleting either dictionary.
PronunciationCorrections=true
; Generated automatically as voices are tuned. Format is internal and migration-safe.
VoiceProfiles=

[Engine]
; system_speech or azure
Engine=system_speech
; default follows the Windows default playback device. Specific selections are saved as a Windows SAPI audio-output token ID.
AudioOutput=default
; Azure region is not secret and may be edited here if a region is not present in the in-game cycle list.
AzureRegion=eastus

; Generated configs end with this marker so an interrupted/truncated schema-3 write can be detected and recovered from TTSConfig.ini.bak.
; MortalShell2TTSConfigEnd=1
